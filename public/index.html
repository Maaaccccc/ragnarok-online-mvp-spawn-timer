<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ragnarok Online MVP Spawn Timer</title>
  <meta name="description" content="A modern, responsive Ragnarok Online MVP Spawn Timer with Convex Mirror remaining time input, live countdowns, sound alerts, and map previews.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ro: {
              gold: '#f59e0b',
              dark: '#0b0f19',
              slate: '#111827',
              border: '#d97706',
              accent: '#fbbf24'
            }
          }
        }
      }
    }
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./styles.css">

  <!-- ES Importmap -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "lucide-react": "https://esm.sh/lucide-react@0.400.0?external=react,react-dom",
      "canvas-confetti": "https://esm.sh/canvas-confetti@1.9.3"
    }
  }
  </script>

  <!-- Babel Standalone for Browser Transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen selection:bg-amber-500 selection:text-black">
  <div id="root"></div>

  <!-- Main App Script -->
  <script type="text/babel" data-type="module" data-presets="react" src="./app.js"></script>
</body>
</html>
